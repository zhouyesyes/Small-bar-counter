<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../style.css"><style>
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:#f7e9df;color:#332b25;font:14px serif}#top-settings-holder{display:flex;justify-content:space-around;height:55px;position:sticky;top:0;z-index:10}#top-settings-holder .drawer-icon{border:0;background:none;font-size:28px;width:35px;height:42px;padding-top:7px}#chat{width:100%;height:calc(100vh - 130px);overflow:auto;display:flex;flex-direction:column}.welcomePanel{width:100%}.mes{width:100%}.mes_text{padding:12px;line-height:1.8}.avatar img{width:40px;height:40px}.mesAvatarWrapper .mes_buttons{display:flex;gap:10px}.mes_button{cursor:pointer;padding:6px}#send_form{height:58px;display:flex;align-items:center;gap:10px}#send_form textarea{flex:1;min-width:0;height:38px;resize:none}#send_form button{padding:6px;background:none;border:0;color:inherit}.page-wrap{padding:0}.page-wrap[hidden]{display:none}.drawer-content{width:100%;max-width:100%}input,select,textarea{max-width:100%}.menu_button{display:inline-flex;padding:8px;border:1px solid #aaa}#WorldInfo{height:calc(100vh - 130px);overflow:auto}.fake-avatar{width:40px;height:40px;background:#aaa}.test-toolbar{position:fixed;right:0;top:50%;display:none}
</style><body><div id="top-settings-holder"></div><div id="chat"></div><div class="page-wrap" id="page-area" hidden></div><form id="send_form"><button id="options_button" class="fa-solid"></button><button id="extensionsMenuButton" class="fa-solid"></button><textarea id="send_textarea" placeholder="输入消息"></textarea><button id="send_but" class="fa-solid"></button></form><script type="module">
import { applyBarTheme, ICONS } from '../../src/bar-theme.mjs';
import { mountChat, unmountChat } from '../../src/bar-chat.mjs';
const avatar='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="80" height="80" fill="#a6b6a3"/><path d="M0 70L30 20l50 60" fill="#496556"/></svg>');
window.testSettings={barTheme:true,barStyle:'maple',theme:'light'};window.calls=0;window.fixtureWarnings=[];
const c={characterId:0,characters:[{name:'潘越',avatar:'pan.png'}],chatMetadata:{},chatId:'test',saveSettingsDebounced(){}};
const host=()=>({context:()=>c,settings:()=>testSettings,config:()=>({cover:{mode:'fixed',fixed:avatar}}),me:()=>({name:'拾叶人',avatar}),him:()=>({name:'潘越',avatar}),image:x=>x,saveSettings(){}});
document.querySelector('#top-settings-holder').innerHTML=ICONS.map(([s,t])=>`<div id="${s.slice(1)}"><button class="drawer-icon" aria-label="${t}"></button></div>`).join('');
function chat(){document.querySelector('#chat').innerHTML=`<div class="mes" is_user="false"><div class="mesAvatarWrapper"><div class="avatar"><img src="${avatar}"></div><div class="mes_buttons"><button class="mes_button" id="native-edit">编辑</button><button class="mes_button">重新生成</button></div></div><div class="mes_block"><div class="ch_name"><div class="mes_header_info"><span class="name_text">潘越</span><span class="timestamp">三月初一</span></div></div><div class="mes_text"><p>檐下的风掠过旧书页。潘越把铜钱收进掌心，偏过头来。</p><p>“急什么。”他懒洋洋地笑了一声，“今晚七个人一起去，也一起回来。”</p></div></div></div>`;window.native=document.getElementById('native-edit');native.onclick=()=>window.calls++;}
window.setStyle=style=>{unmountChat();testSettings.barStyle=style;applyBarTheme(testSettings,()=>c);mountChat(host)};
window.disableTheme=()=>{unmountChat();testSettings.barTheme=false;applyBarTheme(testSettings,()=>c)};
window.showWorld=()=>{unmountChat();document.getElementById('chat').hidden=true;document.getElementById('page-area').hidden=false;document.getElementById('page-area').innerHTML=`<div id="WorldInfo" class="drawer-content openDrawer"><div id="wi-holder"><div id="wiTopBlock"></div><div id="world_popup"><div><select id="world_editor_select"><option value="万象命契">万象命契</option><option value="test">另一卷</option></select></div><div id="world_popup_entries_list"><div class="world_entry"><div class="inline-drawer-header">世界基石</div><input value="命相与境界"></div><div class="world_entry"><div class="inline-drawer-header">石桥学院</div></div></div></div></div></div>`;applyBarTheme(testSettings,()=>c)};
window.showHome=()=>{unmountChat();delete c.characterId;delete c.chatId;document.querySelector('#chat').innerHTML=`<div class="welcomePanel"><div class="recentChats"><div class="recentChat" data-avatar="pan.png" data-file="test"><div class="avatar"><img src="${avatar}"></div><div class="recentChatInfo"><div class="chatNameContainer"><span class="characterName">潘越</span><div class="chatName"><span>潘越</span>后山入学试</div><small class="chatDate">11/12</small></div><div class="chatMessageContainer"><div class="chatMessage">今晚，后山，你们七个一起。</div><div class="chatStats">3 条消息</div></div></div></div></div><button class="openTemporaryChat">新聊天</button></div>`;mountChat(host)};
chat();applyBarTheme(testSettings,()=>c);mountChat(host);window.ready=true;
</script></html>
