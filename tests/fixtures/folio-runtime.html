<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Folio runtime integration fixture</title><link rel="stylesheet" href="../../style.css"><style>
*{box-sizing:border-box}body{margin:0;background:#e9e8e3;color:#333;font:13px serif}#top-settings-holder{display:flex;justify-content:space-around;height:48px;align-items:center}#top-settings-holder button{background:none;border:0;font-size:25px;padding:0}.flex-container{display:flex;gap:8px}.flex1{flex:1}.wide100p{width:100%}.fixture-pages{width:390px;max-width:100vw}.fixture-pages>[hidden]{display:none!important}.drawer-content{width:100%;max-width:100%;padding:12px 16px}.menu_button{cursor:pointer;font-size:14px;border:1px solid #888;padding:5px}input,textarea,select{max-width:100%;font:13px serif}textarea{width:100%;min-height:70px}.fixture-controls{position:fixed;right:10px;top:10px;z-index:1}.avatar{width:50px;height:50px;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.world_entry{position:relative}.inline-drawer-content{display:none}#chat{width:390px;max-width:100vw}.welcomePanel{width:100%}.mes{display:block}.mes_buttons{display:flex;gap:8px}.mesAvatarWrapper{display:flex}.ch_name{display:flex}#send_form{position:fixed;bottom:0;left:0;width:min(390px,100vw);background:#eee}/* Host constraints: the real prompt manager starts as a column, with grid rows. */
#completion_prompt_manager #completion_prompt_manager_list{display:flex;flex-direction:column;min-height:300px;margin:0;list-style:none}
#completion_prompt_manager #completion_prompt_manager_list li{display:grid;grid-template-columns:4fr 80px 45px;width:100%}
#completion_prompt_manager #completion_prompt_manager_list li.completion_prompt_manager_prompt .prompt_manager_prompt_controls span{display:flex;height:18px;width:18px}
#top-bar{width:390px;max-width:100vw}.sb-page{min-width:0}
</style><body><div id="top-bar"><div id="top-settings-holder"></div></div><div hidden><select id="main_api"><option>openai</option></select><select id="chat_completion_source"><option>custom</option></select><input id="custom_model_id" value="Gemini 2.5 Pro"><input id="temp_openai" value="1.05"><input id="openai_max_tokens" value="30000"><input id="openai_max_context" value="2000000"><input id="stream_toggle" type="checkbox" checked></div><main class="fixture-pages">
<section id="left-nav-panel" class="drawer-content openDrawer"><div id="ai_response_configuration"><div id="respective-presets-block"><div id="openai_api-presets"><div class="standoutHeader"><strong>Presets</strong><div class="flex-container"><select id="settings_preset_openai" data-preset-manager-for="openai"><option value="a">【山间闲叙】(V1.0)</option><option value="b">另一份很长的预设标题用于测试末尾省略 V2.0</option></select><div id="update_oai_preset" class="menu_button">Save</div><div data-preset-manager-rename class="menu_button">Rename</div><div id="new_oai_preset" class="menu_button" data-preset-manager-new>New</div><div data-preset-manager-import class="menu_button">Import</div><div data-preset-manager-export class="menu_button">Export</div><div data-preset-manager-restore class="menu_button">Restore</div><div id="delete_oai_preset" data-preset-manager-delete class="menu_button">Delete</div></div></div></div></div><div id="common-gen-settings-block"><label>Temperature<input id="native-temperature" value="1.05"></label></div><div id="openai_settings"><div><div id="completion_prompt_manager"><div class="completion_prompt_manager_header">4500</div><ul id="completion_prompt_manager_list"></ul></div></div></div></div></section>
<section id="rm_api_block" class="drawer-content openDrawer" hidden><div class="wide100p"><h3>Connection profiles</h3><select id="connection_profiles"><option>山间来信</option><option>备用线路</option></select><div class="flex-container"><button id="create_connection_profile">New</button><button id="update_connection_profile">Update</button><button id="edit_connection_profile">Rename</button><button id="delete_connection_profile">Delete</button></div></div><div id="native-api-fields"><input id="api_url" value="https://example.com/v1"><button id="api_button_openai">Connect</button><button id="test_api_button">Test</button><span class="online_status_indicator success"></span></div></section>
<section id="WorldInfo" class="drawer-content openDrawer" hidden><div id="wi-holder"><div id="wiTopBlock">Global books<select id="world_info"><option>通用设定</option></select></div><div class="range-block"><div id="wiActivationSettings"><input id="world_info_depth" value="2"><input id="world_info_budget" value="100"><input id="world_info_recursive" type="checkbox" checked></div></div><div id="world_popup"><div><select id="world_editor_select"><option value="one">山川见闻录</option><option value="two">故人往来录</option></select><button id="world_import_button">Import</button><button id="world_popup_export">Export</button><button id="world_popup_delete">Delete</button></div><div><input id="world_info_search"><button id="world_popup_new">New</button></div><div id="world_popup_entries_list"></div></div></div></section>
<section id="AdvancedFormatting" class="drawer-content openDrawer" hidden><div id="ContextSettings"><h4>Context</h4><select><option>默认模板</option></select><textarea id="native-context">{{system}} {{description}}</textarea></div><div id="InstructSettingsColumn"><h4>Instruct</h4><input id="native-instruct" value="User:"></div><div id="SystemPromptColumn"><h4>System prompt</h4><div id="SystemPromptBlock"><textarea id="native-system">Continue the story.</textarea></div></div><div class="range-block"><h4><span data-i18n="Custom Stopping Strings">Stop</span></h4><textarea id="native-stop">[end]</textarea></div><div class="range-block"><h4><span data-i18n="Reasoning">Reasoning</span></h4><input value="think"></div><div id="InstructSequencesColumn"><textarea>input/output</textarea></div><div name="tokenizerSettingsBlock"><input value="0"></div></section>
<section id="user-settings-block" class="drawer-content openDrawer" hidden><input id="settingsSearch" placeholder="Search"><select id="themes"><option>Native theme</option></select><div name="themeElements"><input type="range" value="50"></div><div name="CharacterHandlingToggles"><input type="checkbox"></div><div name="MiscellaneousToggles"><input type="checkbox"></div><div name="ChatMessageHandlingToggles"><input type="checkbox"></div><div name="AutoCompleteToggle"><input type="checkbox"></div><div name="STscriptToggles"><input type="checkbox"></div></section>
<section id="Backgrounds" class="drawer-content openDrawer" hidden><div class="bg_example"><div class="thumbnail-clipper"><span class="BGSampleTitle">素纸</span></div><button class="mobile-only-menu-toggle" id="native-bg-menu">⋮</button><div class="jg-menu" hidden><button class="jg-button" data-action="edit" title="重命名">Edit</button></div></div></section>
<section id="rm_extensions_block" class="drawer-content openDrawer" hidden><div class="extensions_block"><div class="alignitemscenter"><button id="extensions_details">管理扩展</button><button id="third_party_extension_button">安装扩展</button></div><div id="extensions_settings2"><div class="inline-drawer"><div class="inline-drawer-header">正则</div><div class="inline-drawer-content"><input id="native-regex" value="pattern"></div></div></div></div></section>
<section id="PersonaManagement" class="drawer-content openDrawer" hidden><div id="persona-management-block"><div class="persona_management_left_column"><div id="user_avatar_block"><div class="avatar-container selected" data-avatar-id="p1"><div class="avatar"><img src="../../assets/opening/light-avatar.jpg"></div></div></div></div><div><h4>Persona</h4><textarea id="persona_description">行过山川，听人说话。</textarea><span id="your_name">余何圆</span><button id="persona_rename_button">Rename</button><button id="persona_set_image_button">Photo</button><button id="persona_duplicate_button">Duplicate</button><button id="persona_lore_button">Lore</button><button id="persona_delete_button">Delete</button><button id="lock_persona_default">Default</button><button id="lock_persona_to_char">Character</button><button id="lock_user_name">Chat</button></div></div></section>
<section id="rm_characters_block" class="drawer-content openDrawer" hidden><input id="character_search_bar"><div id="rm_print_characters_block"><div class="character_select" chid="0"><div class="avatar"><img src="../../assets/opening/dark-avatar.jpg"></div><div class="character_select_container"><span class="ch_name">沈砚</span><span class="ch_description">檐下有雨，灯下有书。</span></div></div></div></section>
<section id="rm_ch_create_block" class="drawer-content openDrawer" hidden><form id="form_create"><div id="avatar-and-name-block"><div id="avatar_div"><div id="avatar_div_div"><img id="avatar_load_preview" src="../../assets/opening/dark-avatar.jpg"></div></div><div id="name_div"><input id="character_name_pole" value="沈砚"></div><div id="avatar_controls"><button id="favorite_button">Favorite</button></div></div><div id="descriptionWrapper"><div id="description_div"><textarea id="description_textarea">山中旧友</textarea></div></div><div id="firstMessageWrapper"><textarea id="firstmessage_textarea">坐一会儿？</textarea></div></form></section>
</main><div id="chat" hidden><div class="mes" is_user="false"><div class="mesAvatarWrapper"><div class="avatar"><img src="../../assets/opening/dark-avatar.jpg"></div><span class="timestamp">11月12日</span></div><div class="mes_block"><div class="ch_name"><span class="name_text">沈砚</span><div class="mes_buttons"><button id="native-edit">Edit</button></div></div><div class="mes_text"><p>疏雨过山，花影落在半卷书页上。</p></div></div></div><form id="send_form"><textarea placeholder="Message"></textarea></form>
<script type="module">
import{applyBarTheme}from'../../src/bar-theme.mjs';import{mountPages}from'../../src/bar-pages.mjs';import{mountChat,unmountChat}from'../../src/bar-chat.mjs';import{createAppearanceBridge}from'../../src/appearance-api.mjs';import{configureSplash,openSplashSettings,updatePersonalProfile}from'../../src/splash.mjs';import{seedFolioColors}from'../../src/folio-theme.mjs';
const names=['主提示','角色描述','场景与背景','对话示例','写作风格','补充约定','输出格式','结尾提示','角色关系','前置约束','后置约束','输出检查'];document.querySelector('#completion_prompt_manager_list').innerHTML=names.map((name,i)=>`<li class="completion_prompt_manager_prompt"><span class="drag-handle">${i+1}</span><span class="completion_prompt_manager_prompt_name"><a>${name}</a></span><span><span class="prompt_manager_prompt_controls"><span class="prompt-manager-toggle-action fa-toggle-on" data-native-toggle="${i}"></span><span class="prompt-manager-edit-action">✎</span></span></span><span class="prompt_manager_prompt_tokens">128</span></li>`).join('');
document.querySelector('#world_popup_entries_list').innerHTML=names.map((name,i)=>`<div class="world_entry"><div class="inline-drawer-header inline-drawer-toggle"><div class="WIEntryTitleAndStatus"><div class="flex-container"><textarea name="comment">${name}</textarea><button class="killSwitch fa-toggle-on"></button><span class="inline-drawer-icon down">›</span></div></div></div><div class="inline-drawer-content"><textarea name="content">真实节点的可编辑内容</textarea><input name="depth" value="4"><input name="order" value="100"><input name="probability" value="100"><button class="delete_entry_button">Delete</button></div></div>`).join('');
const selectors=['ai-config-button','sys-settings-button','advanced-formatting-button','WI-SP-button','user-settings-button','backgrounds-button','extensions-settings-button','persona-management-button','rightNavHolder'];document.querySelector('#top-settings-holder').innerHTML=selectors.map(id=>`<button id="${id}"><span class="drawer-icon"></span></button>`).join('');
window.calls={save:0,preset:0,world:0,toggle:0,edit:0,connect:0,style:0};window.nativePreset=document.querySelector('#settings_preset_openai');window.nativeWorld=document.querySelector('#world_editor_select');window.nativeMessage=document.querySelector('.mes_text');window.nativeContext=document.querySelector('#native-context');nativePreset.addEventListener('change',()=>calls.preset++);nativeWorld.addEventListener('change',()=>calls.world++);document.querySelector('#native-edit').onclick=()=>calls.edit++;document.querySelector('#api_button_openai').onclick=()=>calls.connect++;document.querySelectorAll('[data-native-toggle]').forEach(b=>b.onclick=()=>{calls.toggle++;b.classList.toggle('fa-toggle-on');b.classList.toggle('fa-toggle-off')});document.querySelectorAll('.world_entry .inline-drawer-header').forEach(b=>b.onclick=()=>{const icon=b.querySelector('.inline-drawer-icon'),c=b.nextElementSibling;icon.classList.toggle('up');c.style.display=icon.classList.contains('up')?'block':'none'});
window.s={enabled:true,barTheme:true,barStyle:'folio',theme:'light',phoneMode:'float',cat:false};seedFolioColors(s);const ctx={characterId:0,characters:[{name:'沈砚',avatar:'a1',fav:true}],powerUserSettings:{personas:{p1:'余何圆'},persona_descriptions:{p1:{description:'行过山川，听人说话。'}}},getThumbnailUrl:()=>'/assets/opening/dark-avatar.jpg'};configureSplash(s,()=>calls.save++);window.bridge=createAppearanceBridge({getSettings:()=>s,save:()=>updatePersonalProfile({colors:s.splash.colors})});window.apply=()=>applyBarTheme(s,()=>ctx,{appearance:bridge,setSettings:f=>{f(s);calls.save++;apply()},openAppearance:openSplashSettings});window.addEventListener('small-bar-appearance',()=>apply());window.setStyle=style=>{s.barStyle=style;apply();mountChat(()=>({settings:()=>s,context:()=>ctx,him:()=>ctx.characters[0],me:()=>({name:'余何圆'}),config:()=>({}),image:x=>x}))};window.showPage=id=>{document.querySelectorAll('.fixture-pages>section').forEach(r=>r.hidden=r.id!==id);document.querySelector('#chat').hidden=true;mountPages(()=>ctx)};window.showChat=()=>{document.querySelectorAll('.fixture-pages>section').forEach(r=>r.hidden=true);document.querySelector('#chat').hidden=false;mountChat(()=>({settings:()=>s,context:()=>ctx,him:()=>ctx.characters[0],me:()=>({name:'余何圆'}),config:()=>({}),image:x=>x}))};window.disable=()=>{s.barTheme=false;apply();unmountChat()};window.openLegacy=openSplashSettings;window.testContext=ctx;apply();window.ready=true;
</script></body></html>
