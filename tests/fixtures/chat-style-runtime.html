<!doctype html><html class="sb-bar" lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../style.css"><link rel="stylesheet" href="../../assets/companion.css">
<style>body{margin:0;background:linear-gradient(140deg,#f3d5dc,#d9c2cc)}#sheld{display:flex;flex-direction:column;height:100vh}#chat{flex:1;overflow:auto;display:flex;flex-direction:column}#send_form{display:flex;align-items:center;gap:8px;padding:8px}#send_textarea{flex:1}#send_but,#mes_stop{width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer}/* Native host toggles from TT's toggle-dependent.css; the extension does not implement these switches. */
body.no-timer .mes_timer,body.no-timestamps .timestamp,body.no-tokenCount .tokenCounterDisplay,body.no-mesIDDisplay .mesIDDisplay{display:none!important}
</style></head>
<body><div id="sheld"><div id="chat">
<div class="mes" mesid="7" is_user="false"><div class="mesAvatarWrapper"><div class="avatar"><img src="../../assets/opening/dark-avatar.jpg"></div><div class="mesIDDisplay">#7</div><div class="mes_timer">247.8s</div><div class="tokenCounterDisplay">9279t</div><span class="timestamp">2026年8月15日</span></div><div class="mes_block"><div class="ch_name"><span class="name_text">陈谦文</span><div class="mes_buttons"><button id="native-edit">Edit</button></div></div><div class="mes_text"><p>雨把旧街口的霓虹洗得发软。他把伞往你那边偏了偏。<q>“余老板，忘了问，周一去工作室报到要带什么？”</q></p><p><em>别显得太在意。</em></p></div></div></div>
<div class="mes" mesid="8" is_user="true"><div class="mesAvatarWrapper"><div class="avatar"><img src="../../assets/opening/dark-avatar.jpg"></div><div class="mesIDDisplay">#8</div><div class="mes_timer"></div><div class="tokenCounterDisplay">42t</div></div><div class="mes_block"><div class="ch_name"><span class="name_text">yesyes</span><span class="timestamp">2026年8月15日</span></div><div class="mes_text"><p><q>“管饭，来了我这地方，难道我还会让你饿着？”</q>我把钥匙推过吧台。</p></div></div></div>
</div><form id="send_form"><textarea id="send_textarea" placeholder="说点什么"></textarea><div id="mes_stop" style="display:none"><i class="fa-solid fa-circle-stop">■</i></div><div id="send_but" class="fa-solid fa-paper-plane">➤</div></form></div>
<script type="module">
import {mountChat} from '../../src/bar-chat.mjs';import {applyChatStyle} from '../../src/chat-style.mjs';import {applyChatGlass} from '../../src/glass.mjs';
window.s={barTheme:true,barStyle:'default',glass:{opacity:71,blur:3,width:100},splash:{table:'by the window',order:'the usual'}};
document.documentElement.style.cssText='--sb-bar-bg:#f2f0e9;--sb-bar-accent:#bf9186;--sb-bar-ink:#2b2522;--sb-bar-text:#3a332f;--sb-bar-sub:#8f8580;--sb-bar-card:#eadfd9;--sb-f-serif:"Noto Serif SC","Songti SC",serif';
window.timeline=[];timeline[7]={scene:{date:'2026-08-15',time:'21:35',weather:'小雨',where:'旧街口'},drink:{name:'冰裂青橘威士忌特调',abv:18}};timeline[8]={scene:{date:'2026-08-15',time:'21:35',weather:'小雨',where:'旧街口'},drink:null};
window.apply=()=>{applyChatGlass(s);applyChatStyle(s)};apply();
window.nativeRefs=[...document.querySelectorAll('.mes')].map(message=>({message,wrapper:message.querySelector('.mesAvatarWrapper'),fields:[...message.querySelectorAll('.mesIDDisplay,.mes_timer,.tokenCounterDisplay,.timestamp')],stamp:message.querySelector('.timestamp'),stampParent:message.querySelector('.timestamp').parentElement}));
window.nativeClicks=0;nativeRefs[1].stamp.addEventListener('click',()=>nativeClicks++);
mountChat(()=>({settings:()=>s,context:()=>({characterId:0,chatId:'c1',characters:[{avatar:'a.png'}]}),him:()=>({name:'陈谦文',avatar:'../../assets/opening/dark-avatar.jpg'}),me:()=>({name:'yesyes',avatar:'../../assets/opening/dark-avatar.jpg'}),config:()=>({}),image:x=>x,timeline:()=>timeline}));
window.ready=true;
</script></body></html>
