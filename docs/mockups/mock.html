<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#fff;--fg:#111;--dim:#8a8a8a;--line:#e6e6e6;--card:#fff;--soft:#f5f5f5;--me:#111;--meText:#fff;--shade:rgba(0,0,0,.28)}
.dark{--bg:#0b0b0b;--fg:#f2f2f2;--dim:#7d7d7d;--line:#262626;--card:#111;--soft:#1a1a1a;--me:#f2f2f2;--meText:#111;--shade:rgba(0,0,0,.55)}
*{box-sizing:border-box}
body{margin:0;width:390px;height:844px;overflow:hidden;font:14px/1.5 -apple-system,"Helvetica Neue","PingFang SC",sans-serif;color:var(--fg);background:var(--bg);position:relative}
.cap{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
/* 假的酒馆正文 */
.st{position:absolute;inset:0;padding:64px 18px 0;color:var(--dim)}
.st .bar{position:absolute;top:0;left:0;right:0;height:52px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px;gap:10px}
.st p{margin:0 0 14px;color:var(--fg);opacity:.75;font-size:14.5px}
.st .name{font-weight:600;opacity:1;font-size:13px;margin-bottom:4px}
.trigger{width:30px;height:30px;border-radius:50%;background:var(--fg);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:12px;letter-spacing:.05em}
.trigger .dot{width:6px;height:6px;border-radius:50%;background:var(--bg);position:relative}
.trigger{position:relative}.trigger .new{position:absolute;top:-1px;right:-1px;width:9px;height:9px;border-radius:50%;background:var(--fg);border:2px solid var(--bg)}
/* 抽屉 */
.shade{position:absolute;inset:0;background:var(--shade)}
.drawer{position:absolute;top:0;bottom:0;left:0;width:318px;background:var(--bg);border-right:1px solid var(--line);padding:18px 16px;overflow:hidden;display:flex;flex-direction:column;gap:14px}
.dhead{display:flex;align-items:center;justify-content:space-between}
.logo{font-size:13px;font-weight:600;letter-spacing:.32em}
.x{font-size:18px;color:var(--dim)}
.card{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--card)}
.row{display:flex;align-items:center;gap:10px}
.av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#bbb,#555);flex:0 0 auto}
.dark .av{background:linear-gradient(135deg,#666,#222)}
.av.sm{width:30px;height:30px}.av.xs{width:26px;height:26px}
.nm{font-weight:600;font-size:15px;line-height:1.2}.hd{font-size:12px;color:var(--dim)}
.meta{font-size:12px;color:var(--dim);margin:10px 0 2px;display:flex;gap:8px}
.grid{display:grid;grid-template-columns:52px 1fr;gap:7px 10px;margin-top:10px;font-size:13.5px}
.grid .k{color:var(--dim);font-size:11px;letter-spacing:.14em;padding-top:2px}
.want{display:flex;align-items:center;gap:6px}.heart{font-size:11px}
.voice{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;font-size:13.5px}
.flip{font-size:10.5px;letter-spacing:.14em;color:var(--dim);white-space:nowrap;border:1px solid var(--line);border-radius:20px;padding:1px 8px}
.sig{margin-top:10px;font-style:italic;color:var(--dim);font-size:12.5px;text-align:center}
.post{display:flex;gap:10px}
.post .body{font-size:13.5px;margin:3px 0 6px}
.acts{display:flex;gap:16px;font-size:12px;color:var(--dim)}
.media{height:96px;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--dim);margin-bottom:6px}
.phonecard{display:flex;align-items:center;justify-content:space-between}
.badge{min-width:18px;height:18px;border-radius:9px;background:var(--fg);color:var(--bg);font-size:11px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
/* 小手机 */
.phone{position:absolute;left:50%;transform:translateX(-50%);bottom:28px;width:300px;height:540px;border-radius:30px;border:1px solid var(--line);background:var(--bg);box-shadow:0 18px 50px rgba(0,0,0,.28);display:flex;flex-direction:column;overflow:hidden}
.ph{display:flex;align-items:center;gap:9px;padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.ph .nm{font-size:14px}.ph .hd{font-size:11px}
.ph .close{margin-left:auto;color:var(--dim);font-size:16px}
.msgs{flex:1;padding:12px 12px 6px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;overflow:hidden}
.time{text-align:center;font-size:10.5px;color:var(--dim);letter-spacing:.1em;margin:4px 0}
.b{flex:0 0 auto;max-width:76%;padding:7px 11px;border-radius:16px;font-size:13.5px;line-height:1.4}
.b.c{align-self:flex-start;border:1px solid var(--line);border-bottom-left-radius:5px}
.b.u{align-self:flex-end;background:var(--me);color:var(--meText);border-bottom-right-radius:5px}
.b.v{display:flex;align-items:center;gap:8px}
.wave{display:flex;gap:2px;align-items:center}.wave i{width:2px;border-radius:1px;background:var(--fg);display:block}
.b.img{padding:0;overflow:hidden;width:150px}.b.img .pic{height:96px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--dim)}
.typing{align-self:flex-start;font-size:12px;color:var(--dim);letter-spacing:.2em}
.pend{align-self:flex-end;font-size:10.5px;color:var(--dim)}
.inp{display:flex;align-items:center;gap:8px;padding:8px 10px 12px;border-top:1px solid var(--line)}
.plus{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:16px}
.field{flex:1;height:32px;border-radius:16px;background:var(--soft);display:flex;align-items:center;padding:0 12px;font-size:13px;color:var(--dim)}
.send{width:30px;height:30px;border-radius:50%;background:var(--fg);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:14px}
/* 抽屉顶上换成个人主页（11/9 她要的：有背景、头像居中、下面滑动态、只显示最新三条） */
.drawer.pf{padding:0;gap:0}
.cover{height:128px;flex:0 0 auto;position:relative;background:linear-gradient(160deg,#dcdcdc,#9a9a9a 55%,#5a5a5a);display:flex;align-items:flex-end;justify-content:flex-end;padding:8px 10px;font-size:10.5px;color:rgba(255,255,255,.8);letter-spacing:.06em}
.dark .cover{background:linear-gradient(160deg,#3a3a3a,#1e1e1e 60%,#111);color:rgba(255,255,255,.45)}
.cover .x{position:absolute;top:12px;right:14px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px}
.cover .logo{position:absolute;top:18px;left:16px;color:#fff;font-size:11px}
.pfav{width:78px;height:78px;flex:0 0 auto;border-radius:50%;margin:-39px auto 0;border:3px solid var(--bg);background:linear-gradient(135deg,#bbb,#555);position:relative}
.dark .pfav{background:linear-gradient(135deg,#777,#2a2a2a)}
.pfname{text-align:center;font-weight:600;font-size:17px;margin-top:8px;line-height:1.2}
.pfhd{text-align:center;font-size:12px;color:var(--dim)}
.pfbio{text-align:center;font-size:13px;font-style:italic;margin:8px 22px 0}
.pfmeta{display:flex;justify-content:center;gap:14px;font-size:11.5px;color:var(--dim);margin-top:8px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.pfmeta b{color:var(--fg);font-weight:600}
.feedcap{margin:16px 16px 0;padding-bottom:8px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.feed{flex:1;overflow:hidden;position:relative}
.feed .post{padding:12px 16px;border-bottom:1px solid var(--line)}
.feed .media{height:74px}
.below{flex:0 0 auto;padding:10px 16px 14px;border-top:1px solid var(--line);display:flex;gap:10px}
.below .card{flex:1;padding:10px 12px;border-radius:12px}
.tabs{display:flex;flex:0 0 auto;border-top:1px solid var(--line);font-size:13px;color:var(--dim);padding-bottom:6px}
.tabs>span{flex:1;text-align:center;padding:13px 0 12px}.tabs .on{color:var(--fg);font-weight:600;box-shadow:inset 0 2px 0 var(--fg)}
.badge.sm{height:15px;min-width:15px;font-size:10px;padding:0 4px;vertical-align:1px}
.seeall{text-align:center;font-size:12px;color:var(--dim);padding:12px 0}
.dday{font-size:12px;color:var(--dim)}.dday b{color:var(--fg);font-size:15px;margin-right:4px}
.dtext{margin-top:10px;font-size:14px;line-height:1.75;font-family:"Songti SC","Noto Serif CJK SC",serif}
.dsign{text-align:right;color:var(--dim);font-size:12.5px;margin-top:8px;font-style:italic}
.dold{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.dold span:first-child{color:var(--dim);font-size:12px}
.ptabs{display:flex;align-items:center;gap:20px;padding:12px 16px 10px;border-bottom:1px solid var(--line);font-size:14px;color:var(--dim)}
.ptabs .on{color:var(--fg);font-weight:600}.ptabs .close{margin-left:auto;font-size:16px}
.xcover{height:78px;flex:0 0 auto;position:relative;background:linear-gradient(160deg,#dcdcdc,#9a9a9a 55%,#5a5a5a);display:flex;align-items:flex-end;justify-content:flex-end;padding:6px 10px;font-size:10px;color:rgba(255,255,255,.8)}
.dark .xcover{background:linear-gradient(160deg,#3a3a3a,#1e1e1e 60%,#111);color:rgba(255,255,255,.45)}
.xback{position:absolute;top:8px;left:10px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.4);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px}
.xtop{position:relative;z-index:1;display:flex;align-items:flex-end;gap:8px;padding:0 14px;margin-top:-26px}
.xav{width:58px;height:58px;border-radius:50%;border:3px solid var(--bg);background:linear-gradient(135deg,#bbb,#555);margin-right:auto}
.dark .xav{background:linear-gradient(135deg,#777,#2a2a2a)}
.xbtn{font-size:12px;border:1px solid var(--line);border-radius:16px;padding:3px 13px;font-weight:600}.xbtn.solid{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.xname{font-weight:700;font-size:16px;padding:6px 14px 0;line-height:1.2}
.xbio{font-size:12.5px;padding:5px 14px 0}
.xstat{display:flex;gap:14px;font-size:12px;color:var(--dim);padding:5px 14px 0}.xstat b{color:var(--fg)}
.xtabs{display:flex;margin-top:8px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--dim)}.xtabs span{flex:1;text-align:center;padding-bottom:7px}.xtabs .on{color:var(--fg);font-weight:600;box-shadow:inset 0 -2px 0 var(--fg)}
.xfeed{flex:1;overflow:hidden}.xfeed .post{padding:10px 14px;border-bottom:1px solid var(--line)}.xfeed .media{height:64px}.xfeed .body{font-size:13px}
.xnav{display:flex;justify-content:space-around;padding:9px 0 12px;border-top:1px solid var(--line)}
.xnav svg{width:21px;height:21px;fill:none;stroke:var(--fg);stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
.bgsheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:14px 16px 20px;box-shadow:0 -10px 30px rgba(0,0,0,.18)}
.bgsheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:12.5px;margin:10px 0 6px}
.seg span{flex:1;text-align:center;padding:7px 0;color:var(--dim)}.seg .on{background:var(--fg);color:var(--bg);font-weight:600}
.hint{font-size:11.5px;color:var(--dim);margin-bottom:12px}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.th{border-radius:10px;height:62px;position:relative;overflow:hidden}
.th.a{background:linear-gradient(160deg,#9a9a9a,#3c3c3c)}.th.b{background:linear-gradient(160deg,#f1f1f1,#c9c9c9)}.th.c{background:linear-gradient(160deg,#cfcfcf,#7a7a7a)}.th.d{background:linear-gradient(160deg,#555,#1a1a1a)}
.dark .th.b{background:linear-gradient(160deg,#5a5a5a,#333)}
.th.on{outline:2px solid var(--fg);outline-offset:2px}
.tag{font-size:12px;text-align:center;margin-top:5px}.tag.dim{color:var(--dim)}
.th.add{border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--dim)}
.editbg{position:absolute;bottom:8px;left:10px;font-size:10.5px;border-radius:12px;background:rgba(0,0,0,.4);color:#fff;padding:2px 9px}
.mo{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}.mo.last{justify-content:center;border:0;padding:12px}
.mn{font-size:13.5px}
.mo .body{font-size:13.5px;margin:2px 0 6px}
.mt{display:flex;justify-content:space-between;font-size:11px;color:var(--dim)}
.mmore{background:var(--soft);border-radius:4px;padding:0 6px;color:var(--fg)}
.mbox{background:var(--soft);border-radius:6px;margin-top:6px;padding:6px 8px;font-size:12.5px;line-height:1.6}
.mlike{color:var(--dim);border-bottom:1px solid var(--line);padding-bottom:3px;margin-bottom:3px}
.mc.dim{color:var(--dim);display:flex;justify-content:space-between}.letgo{color:var(--fg);font-size:11px;border:1px solid var(--line);border-radius:10px;padding:0 7px}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-bottom:6px}.mgrid span{aspect-ratio:1;background:var(--soft);border-radius:4px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;color:var(--dim);padding:4px}
.music{margin:4px 16px 18px;border:1px solid var(--line);border-radius:14px;padding:14px}
.mrow{display:flex;gap:12px;align-items:center}
.music .cover{width:56px;height:56px;border-radius:8px;background:linear-gradient(135deg,#ccc,#666);flex:0 0 auto}
.dark .music .cover{background:linear-gradient(135deg,#666,#222)}
.mtt{font-weight:600;font-size:14px}.lyric{font-size:12px;margin-top:3px;font-style:italic}
.bar2{height:2px;background:var(--line);border-radius:1px;margin:12px 0 10px}.bar2 i{display:block;width:38%;height:100%;background:var(--fg)}
.mctl{display:flex;justify-content:space-around;align-items:center;font-size:15px;color:var(--dim)}.mctl .play{width:34px;height:34px;border-radius:50%;background:var(--fg);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:12px}
#feed{overflow:auto}
.music2{margin:6px 0 0;padding:22px 20px 26px;border-top:1px solid var(--line);background:linear-gradient(var(--soft),var(--bg) 70%)}
.bigcover{width:190px;height:190px;margin:0 auto;border-radius:14px;background:linear-gradient(135deg,#d6d6d6,#6a6a6a 60%,#2e2e2e);box-shadow:0 14px 34px rgba(0,0,0,.25)}
.dark .bigcover{background:linear-gradient(135deg,#6a6a6a,#2a2a2a 60%,#111);box-shadow:0 14px 34px rgba(0,0,0,.6)}
.mt2{text-align:center;font-size:20px;font-weight:700;margin-top:18px;letter-spacing:.02em}
.ma2{text-align:center;font-size:12.5px;color:var(--dim);margin-top:2px}
.lyr{text-align:center;margin-top:14px;font-size:13px;color:var(--dim);line-height:1.9}.lyr .cur{color:var(--fg);font-size:15px;font-weight:600}
.prog{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--dim);margin-top:14px}.prog .bar2{flex:1;margin:0}
.mctl2{display:flex;justify-content:space-between;align-items:center;margin:14px 8px 0;font-size:16px;color:var(--dim)}.mctl2 .big{font-size:20px;color:var(--fg)}
.play2{width:54px;height:54px;border-radius:50%;background:var(--fg);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:18px}
.msearch{margin-top:18px;height:34px;border-radius:17px;border:1px solid var(--line);display:flex;align-items:center;padding:0 14px;font-size:12.5px;color:var(--dim)}
.memo{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.memo .ck{width:16px;height:16px;border:1.5px solid var(--fg);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;flex:0 0 auto}
.memo.done{color:var(--dim);text-decoration:line-through}.memo.done .ck{border-color:var(--dim)}
.dback{font-size:12.5px;color:var(--dim)}
.dtitle{font-size:18px;font-weight:700;margin-top:4px;font-family:"Songti SC","Noto Serif CJK SC",serif}
.slip{margin:16px 30px 0 auto;width:72%;background:var(--soft);border:1px solid var(--line);padding:8px 10px;font-size:12.5px;transform:rotate(-1.5deg);box-shadow:0 3px 8px rgba(0,0,0,.08)}
.dacts{display:flex;justify-content:space-between;margin-top:20px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--dim)}
.drawer.pf.mini .cover{height:56px}.drawer.pf.mini .cover>span:not(.x){display:none}.drawer.pf.mini .cover{font-size:0}
.drawer.pf.mini .pfav,.drawer.pf.mini .pfhd,.drawer.pf.mini .pfbio,.drawer.pf.mini .pfmeta{display:none}
.drawer.pf.mini .pfname{position:absolute;top:16px;left:16px;margin:0;color:#fff;font-size:15px}
.phone.home{background:linear-gradient(180deg,var(--soft),var(--bg) 60%)}
.sbar{display:flex;justify-content:space-between;align-items:center;padding:14px 22px 0;font-size:12px;font-weight:600}.sbar .close{color:var(--dim);font-weight:400;font-size:15px}
.clock{text-align:center;margin-top:18px}.ct{font-size:54px;font-weight:200;letter-spacing:.02em;line-height:1}.cd{font-size:12px;color:var(--dim);margin-top:6px}
.widget{margin:18px 18px 0;border:1px solid var(--line);border-radius:18px;padding:10px 12px;background:var(--bg)}
.wcov{width:36px;height:36px;border-radius:6px;background:linear-gradient(135deg,#ccc,#555)}.dark .wcov{background:linear-gradient(135deg,#666,#222)}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 0;padding:22px 14px 0}
.app{display:flex;flex-direction:column;align-items:center;gap:5px}
.ai{width:50px;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center;position:relative}
.ai svg{width:24px;height:24px;fill:none;color:var(--fg);stroke:var(--fg);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ab{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;border-radius:9px;background:var(--fg);color:var(--bg);font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg)}
.an{font-size:11px}
.dock{margin:auto 12px 0;display:flex;justify-content:space-around;padding:10px 0;border-radius:22px;background:var(--soft);border:1px solid var(--line)}.dock .an{font-size:10.5px}
.dock .ai{background:var(--bg)}
.hbar{width:100px;height:4px;border-radius:2px;background:var(--fg);opacity:.5;margin:10px auto 10px}
.bk{font-size:22px;color:var(--dim);line-height:1;margin-right:-2px}
.ph .close{margin-left:auto}
.tr{align-self:flex-start;width:170px;border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:var(--soft)}
.trt{font-size:16px;font-weight:700}.trn{font-size:12px;color:var(--dim);margin-top:2px}.trs{font-size:10.5px;color:var(--dim);border-top:1px solid var(--line);margin-top:7px;padding-top:4px}
.note{align-self:center;font-size:10.5px;color:var(--dim);margin:4px 0}
.plus.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.ppanel{display:grid;grid-template-columns:repeat(5,1fr);padding:4px 8px 6px}
.ai.sm{width:42px;height:42px;border-radius:12px}.ai.sm svg{width:21px;height:21px}
.clist{flex:1;padding:8px 14px;overflow:hidden}
.creq{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:6px 0}
.cr{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.cr.dim{opacity:.55}
.cr .xbtn{padding:2px 10px;font-size:11.5px}.cr .more{color:var(--dim)}
.slist{flex:1;overflow:hidden;padding:2px 14px 6px;background:var(--soft)}
.sh{font-size:10.5px;letter-spacing:.14em;color:var(--dim);margin:12px 4px 5px}
