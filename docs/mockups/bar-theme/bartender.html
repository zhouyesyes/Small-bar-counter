<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+SC:wght@400;500;700&display=block" rel="stylesheet">
<style>
body { --bg:#E7E5E1; --paper:#EFEDEA; --ink:#1C1B1A; --text:#4F4D49; --sub:#9A968F; --line:#CFCBC4; --dot:#B9B4AC; --off:#B5B0A8; --btn:#1C1B1A; --btntext:#F3F1EE; }
body.dark { --bg:#141413; --paper:#1C1C1A; --ink:#ECE8E1; --text:#B3AEA6; --sub:#6F6B65; --line:#2E2D2A; --dot:#45433F; --off:#55524D; --btn:#ECE8E1; --btntext:#141413; }
* { box-sizing:border-box; margin:0; }
body { width:390px; background:var(--bg); color:var(--text); font-family:'Noto Serif SC',serif; padding-bottom:40px; }
.x { position:absolute; right:22px; top:18px; font:500 14px 'Cormorant Garamond',serif; color:var(--ink); letter-spacing:.1em; }
.cover { position:relative; text-align:center; padding:34px 0 0; }
.cover img { width:250px; display:block; margin:0 auto -6px; }
body.dark .cover img { filter:invert(.88) hue-rotate(180deg) brightness(1.05); }
.title { font-family:'Pinyon Script',cursive; font-size:46px; color:var(--ink); line-height:1.1; }
.subt { font:500 10.5px 'Cormorant Garamond',serif; letter-spacing:.42em; color:var(--text); margin-top:6px; }
.zh { font-size:11px; color:var(--sub); letter-spacing:.3em; margin-top:6px; }
.tabs { display:flex; justify-content:center; gap:26px; margin:26px 0 18px; font-size:13px; letter-spacing:.12em; }
.tabs span { color:var(--sub); } .tabs span.on { color:var(--ink); font-weight:700; }
.tabs i { font-family:'Cormorant Garamond',serif; font-style:normal; margin-right:4px; }
.wrap { padding:0 22px; }
.special { background:var(--paper); padding:16px 18px; display:flex; align-items:center; gap:12px; }
.special .k { font:italic 13px 'Cormorant Garamond',serif; color:var(--sub); }
.special b { display:block; font-size:16px; color:var(--ink); font-weight:700; margin-top:2px; }
.special .btn { margin-left:auto; background:var(--btn); color:var(--btntext); font-size:12px; padding:8px 12px; letter-spacing:.12em; white-space:nowrap; }
.tools { display:flex; justify-content:space-between; font-size:11.5px; color:var(--sub); letter-spacing:.1em; margin:12px 2px 6px; }
.sec { padding:18px 0 16px; border-bottom:1px solid var(--line); }
.sec .row { display:flex; align-items:baseline; gap:10px; }
.sec .no { font:500 13px 'Cormorant Garamond',serif; color:var(--sub); width:26px; }
.sec .nm { font-size:16px; color:var(--ink); letter-spacing:.18em; font-weight:500; }
.sec .tag { font-size:10.5px; color:var(--sub); letter-spacing:.1em; border:1px solid var(--line); padding:1px 5px; }
.sec .cnt { margin-left:auto; font:500 14px 'Cormorant Garamond',serif; color:var(--text); letter-spacing:.06em; }
.sec .en { font:italic 12px 'Cormorant Garamond',serif; color:var(--sub); margin:2px 0 0 36px; }
.sec.closed .cnt::after { content:'  +'; color:var(--sub); }
.sec.open .cnt::after { content:'  –'; color:var(--sub); }
.items { margin:14px 0 2px 36px; }
.note { font-size:11px; color:var(--sub); margin-bottom:10px; letter-spacing:.06em; }
.it { display:flex; align-items:center; gap:8px; font-size:13.5px; padding:6px 0; color:var(--ink); }
.it .rd { width:9px; height:9px; border-radius:50%; border:1px solid var(--ink); flex:none; }
.it.on .rd { background:var(--ink); }
.it .lead { flex:1; border-bottom:1px dotted var(--dot); transform:translateY(-4px); }
.it .st { font-size:11px; letter-spacing:.12em; }
.it.off { color:var(--off); } .it.off .rd { border-color:var(--off); }
.it.off .nmx { text-decoration:line-through; text-decoration-color:var(--off); }
.foot { text-align:center; font:italic 12px 'Cormorant Garamond',serif; color:var(--sub); margin-top:26px; letter-spacing:.1em; }
/* 调酒台（参数页） */
.param { display:flex; align-items:baseline; gap:8px; padding:11px 0; font-size:14px; color:var(--ink); }
.param .lead { flex:1; border-bottom:1px dotted var(--dot); }
.param .v { font:600 16px 'Cormorant Garamond',serif; }
.param small { display:block; font-size:10.5px; color:var(--sub); }
.h { font:italic 14px 'Cormorant Garamond',serif; color:var(--sub); text-align:center; margin:22px 0 6px; letter-spacing:.2em; }
.h::before,.h::after { content:'—'; margin:0 10px; }
</style><style>
.hd { text-align:center; padding:46px 0 0; }
.hd .title { font-size:44px; }
.status { margin-top:26px; background:var(--paper); padding:20px 18px 18px; }
.status .k { font:italic 13px 'Cormorant Garamond',serif; color:var(--sub); }
.status .live { float:right; font-size:11.5px; letter-spacing:.14em; color:var(--ink); }
.status .live::before { content:'●'; color:#5E8C61; margin-right:6px; }
.status .bad::before { color:#B0564B; }
.status h2 { font-family:'Cormorant Garamond',serif; font-weight:600; font-size:28px; color:var(--ink); margin-top:6px; letter-spacing:.02em; }
.status .s { font-size:11.5px; color:var(--sub); letter-spacing:.06em; margin-top:2px; }
.status .btns { display:flex; gap:10px; margin-top:16px; }
.status .btns span { font-size:12px; letter-spacing:.12em; padding:8px 12px; border:1px solid var(--ink); color:var(--ink); }
.status .btns span.p { background:var(--btn); color:var(--btntext); }
.fold { margin-top:14px; border-top:1px solid var(--ink); border-bottom:1px solid var(--line); padding:14px 0; }
.fold .row { display:flex; align-items:baseline; gap:10px; }
.fold .nm { font-size:15px; color:var(--ink); letter-spacing:.18em; }
.fold .en { font:italic 12px 'Cormorant Garamond',serif; color:var(--sub); }
.fold .pm { margin-left:auto; color:var(--sub); font-size:14px; }
.fold .sum { font-size:11.5px; color:var(--sub); margin-top:6px; letter-spacing:.04em; line-height:1.7; }
.param .v small { display:inline; font-size:11px; color:var(--sub); }
.param .v.vz { font:500 13.5px 'Noto Serif SC',serif; }
.lock { font-size:11px; color:var(--sub); text-align:center; margin-top:14px; letter-spacing:.06em; }
</style><style>
.search { display:flex; align-items:center; gap:10px; margin:20px 0 4px; font-size:12.5px; color:var(--sub); }
.search .box { flex:1; border-bottom:1px solid var(--line); padding:6px 0; }
.search .new { background:var(--btn); color:var(--btntext); padding:7px 11px; letter-spacing:.1em; }
.pg { display:flex; justify-content:center; gap:18px; font:500 13px 'Cormorant Garamond',serif; color:var(--sub); margin-top:16px; letter-spacing:.1em; }
.card { margin-top:26px; background:var(--btn); color:var(--btntext); border-radius:14px; padding:18px; position:relative; }
.card .row { display:flex; gap:14px; }
.card .ph { width:74px; height:92px; border-radius:6px; background-size:cover; flex:none; }
.card .nm { font-size:20px; font-weight:700; letter-spacing:.06em; }
.card .no { font:500 11px 'IBM Plex Mono',monospace; opacity:.6; letter-spacing:.14em; margin-top:2px; }
.card .ds { font-size:12px; opacity:.8; margin-top:10px; line-height:1.6; }
.card .bt { display:flex; justify-content:space-between; font:italic 11.5px 'Cormorant Garamond',serif; opacity:.55; margin-top:14px; letter-spacing:.1em; border-top:1px solid currentColor; padding-top:8px; }
.card .use { position:absolute; right:16px; top:16px; font-size:10.5px; letter-spacing:.16em; opacity:.8; }
.bind { display:flex; gap:8px; margin-top:8px; }
.bind span { flex:1; text-align:center; font-size:12px; padding:8px 0; border:1px solid var(--line); color:var(--sub); letter-spacing:.08em; }
.bind span.on { border-color:var(--ink); color:var(--ink); }
.pr { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
.pr .a { width:42px; height:42px; border-radius:50%; background-size:cover; flex:none; }
.pr .a.sq { width:54px; height:54px; border-radius:8px; }
.pr .b { flex:1; min-width:0; }
.pr .b b { font-size:14.5px; color:var(--ink); font-weight:500; }
.pr .b .d { font-size:11.5px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
.pr .b .q { font:italic 12px 'Noto Serif SC',serif; color:var(--text); margin-top:4px; }
.pr .b .tg { font-size:10.5px; color:var(--sub); margin-top:3px; }
.pr .r { font-size:11px; color:var(--sub); letter-spacing:.08em; white-space:nowrap; }
.pr .star { font-size:10px; letter-spacing:.1em; border:1px solid var(--ink); color:var(--ink); padding:0 5px; margin-left:6px; vertical-align:2px; }
.pr .v { font:12px 'Cormorant Garamond',serif; color:var(--sub); margin-left:6px; }
.pr.cur b::after { content:'● 在用'; font-size:10px; color:#5E8C61; margin-left:8px; letter-spacing:.1em; }
.seats { display:flex; gap:22px; justify-content:center; margin-top:12px; }
.seats div { text-align:center; } .seats .a { width:62px; height:62px; border-radius:50%; background-size:cover; margin:0 auto; border:1px solid var(--line); }
.seats b { display:block; font-size:12px; color:var(--ink); font-weight:500; margin-top:6px; } .seats i { font-style:normal; font-size:10px; color:var(--sub); letter-spacing:.1em; }
.filt { display:flex; gap:14px; font-size:11.5px; color:var(--sub); margin:10px 0 4px; letter-spacing:.06em; } .filt .on { color:var(--ink); }
</style><script src="icons.js"></script><style>
.tb { display:flex; justify-content:space-around; padding:12px 6px 12px; border-bottom:1px solid var(--line); }
.tb .t { color:var(--sub); position:relative; display:flex; justify-content:center; }
.tb svg { width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.3; stroke-linecap:round; stroke-linejoin:round; }
.tb .on { color:var(--ink); } .tb .on::after { content:''; width:4px; height:4px; border-radius:50%; background:var(--ink); position:absolute; bottom:-8px; }
.ban { height:150px; background:url(bokeh.svg) center/cover; }
.back { padding:14px 22px 0; font-size:12.5px; color:var(--sub); letter-spacing:.1em; }
.prof { padding:0 22px; display:flex; gap:16px; align-items:center; margin-top:18px; }
.prof .a { width:96px; height:96px; border-radius:50%; background:url(ava.svg) center/cover; flex:none; }
.prof .n { padding-bottom:0; } .prof .n b { font-size:24px; color:var(--ink); letter-spacing:.08em; display:block; }
.prof .n span { font:500 10.5px 'IBM Plex Mono',monospace; color:var(--sub); letter-spacing:.12em; }
.quote { font:italic 14px 'Noto Serif SC',serif; color:var(--text); margin:16px 0 0; }
.acts { display:flex; flex-wrap:wrap; gap:8px 14px; font-size:12px; color:var(--sub); margin-top:16px; letter-spacing:.06em; }
.acts .on { color:var(--ink); }
.tags { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
.tags span { font-size:11.5px; border:1px solid var(--line); padding:3px 9px; color:var(--text); }
.tags span.add { border-style:dashed; color:var(--sub); }
.sh { display:flex; align-items:baseline; gap:10px; margin-top:28px; padding-bottom:8px; border-bottom:1px solid var(--ink); }
.sh b { font-size:15px; color:var(--ink); letter-spacing:.2em; font-weight:500; } .sh i { font:italic 12px 'Cormorant Garamond',serif; color:var(--sub); }
.sh em { margin-left:auto; font:12px 'Cormorant Garamond',serif; color:var(--sub); font-style:normal; letter-spacing:.06em; }
.txt { font-size:13.5px; line-height:1.8; color:var(--text); padding:12px 0 0; }
.txt.empty { color:var(--sub); font-style:italic; }
.sw { display:flex; justify-content:center; gap:16px; font:13px 'Cormorant Garamond',serif; color:var(--sub); margin-top:10px; letter-spacing:.1em; }
</style><link rel="stylesheet" href="palette.css"></head><body><div class="tb" id="tb"></div>
<div class="back">‹ 调酒师名单</div>
<div class="prof"><div class="a"></div><div class="n"><b>沈砚</b><span>BARTENDER · v2.0 · 12 t</span></div></div>
<div class="wrap">
 <div class="quote">“雨停了，我送你回去。”</div>
 <div class="acts"><span class="on">★ 常点</span><span>[ 他的酒单 ]</span><span>[ 表情 ]</span><span>[ 导出 ]</span><span>[ 复制 ]</span><span>[ 更多 ▾ ]</span><span style="margin-left:auto">[ 删 ]</span></div>
 <div class="tags"><span>#现代</span><span>#雨夜</span><span class="add">+ 标签</span></div>
 <div class="sh"><b>关于他</b><i>About</i><em>0 t</em></div>
 <div class="txt empty">还没写。点这里写他长什么样、什么脾气。</div>
 <div class="sh"><b>开场白</b><i>First Pour</i><em>9 t</em></div>
 <div class="txt">檐下的灯晃了一下，他抬起头。</div>
 <div class="sw"><span>‹</span><span>1 / 3</span><span>›</span><span style="margin-left:6px">[ + 再写一个 ]</span></div>
 <div class="fold" style="margin-top:26px"><div class="row"><span class="nm">作者的话</span><span class="en">Creator's Note</span><span class="pm">+</span></div><div class="sum">作者写给你看的说明，不会发给他</div></div>
 <div class="fold" style="margin-top:0;border-top:none"><div class="row"><span class="nm">更多设定</span><span class="en">Behind the Bar</span><span class="pm">+</span></div><div class="sum">性格摘要 · 场景 · 对话示例 · 深度提示</div></div>
 <div class="foot">— on shift since 2026 —</div></div>
<script>if(new URLSearchParams(location.search).get("dark"))document.body.classList.add("dark");
document.getElementById('tb').innerHTML=TABS.map((t,i)=>`<div class="t ${i==8?'on':''}"><svg viewBox="0 0 24 24">${t[1]}</svg></div>`).join('');</script></body></html>
