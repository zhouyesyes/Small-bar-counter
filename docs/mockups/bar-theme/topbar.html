<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=Cormorant+Garamond:ital,wght@1,400&display=block" rel="stylesheet">
<script src="icons.js"></script>
<style>
body { --bg:#E7E5E1; --ink:#1C1B1A; --sub:#A29E97; --line:#D3CFC8; margin:0; width:390px; background:var(--bg); font-family:'Noto Serif SC',serif; padding:10px 0 20px; }
body.dark { --bg:#141413; --ink:#ECE8E1; --sub:#5F5C57; --line:#2A2927; }
h4 { font:italic 13px 'Cormorant Garamond',serif; color:var(--sub); margin:18px 18px 8px; font-weight:400; letter-spacing:.1em; }
.bar { display:flex; justify-content:space-around; align-items:flex-end; padding:8px 6px 10px; border-bottom:1px solid var(--line); }
.bar .t { display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--sub); position:relative; }
.bar svg { width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.3; stroke-linecap:round; stroke-linejoin:round; }
.bar .on { color:var(--ink); }
.a .on::after { content:''; width:4px; height:4px; border-radius:50%; background:var(--ink); position:absolute; bottom:-8px; }
.b .t span { font-size:8.5px; letter-spacing:.05em; }
.c .t { font-size:15px; letter-spacing:0; padding-bottom:2px; }
.c .on { border-bottom:1px solid var(--ink); }
</style><link rel="stylesheet" href="palette.css"></head><body>
<h4>A · 细线小物件（选中的下面一个小点）</h4><div class="bar a" id="a"></div>
<h4>B · 小物件 + 底下一行小字</h4><div class="bar b" id="b"></div>
<h4>C · 只有一个字，像菜单上的小标题</h4><div class="bar c" id="c"></div>
<script>
if(new URLSearchParams(location.search).get('dark'))document.body.classList.add('dark');
const on=8;
a.innerHTML=TABS.map((t,i)=>`<div class="t ${i==on?'on':''}"><svg viewBox="0 0 24 24">${t[1]}</svg></div>`).join('');
b.innerHTML=TABS.map((t,i)=>`<div class="t ${i==on?'on':''}"><svg viewBox="0 0 24 24">${t[1]}</svg><span>${t[0]}</span></div>`).join('');
const one=['方','窖','式','单','灯','窗','具','卡','师'];
c.innerHTML=one.map((t,i)=>`<div class="t ${i==on?'on':''}">${t}</div>`).join('');
</script></body></html>
