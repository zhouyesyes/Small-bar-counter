<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>音乐布局预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#e6e5e4;font:13px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:var(--fg);--bg:#f5f4f3;--fg:#272727;--dim:#777;--accent:#686868;--ink:#fff;--tint:#eeedec}body.dark{--bg:#202020;--fg:#eee;--dim:#aaa;--accent:#bbb;--ink:#222;--tint:#292929}body.pink{--bg:#ffe1f7;--fg:#272727;--dim:#736573;--accent:#70bfc4;--ink:#173134;--tint:#f7e3f2}
button,input{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer;padding:5px}button:focus-visible{outline:2px solid var(--accent)}.page{width:min(100%,390px);min-height:100vh;background:var(--bg);margin:auto;padding-bottom:18px}.cover{height:145px;background:url('../../assets/opening/light-cover.jpg') center/cover;position:relative}.brand{position:absolute;top:17px;left:20px;color:white;letter-spacing:4px;font-size:10px}.theme{position:absolute;right:14px;top:12px;border-radius:50%;background:#0005;color:white;width:28px;height:28px;padding:0}.avatar{display:block;width:66px;height:66px;object-fit:cover;border:3px solid var(--bg);border-radius:50%;margin:-33px auto 0;position:relative}.name{text-align:center;font-size:19px;font-weight:600;margin:7px 0 1px}.sign{text-align:center;font-size:12px;font-style:italic;margin:0}.receipt{width:61%;margin:14px auto 18px;font:10px/1.8 ui-monospace,monospace}.receipt div{display:flex;gap:8px;align-items:baseline}.receipt i{flex:1;border-bottom:1px dotted var(--accent);opacity:.6}.receipt label{color:var(--dim);letter-spacing:1px}.player{margin:0 16px;border:1px solid var(--accent);border-radius:18px;overflow:hidden;padding:17px}.cap{display:flex;justify-content:space-between;align-items:center;font-size:9px;letter-spacing:2px;color:var(--dim);margin-bottom:14px}.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin-right:7px}.state{font-size:10px;letter-spacing:0}.state button{padding:0 0 0 7px;text-decoration:underline}.track{display:flex;gap:13px;align-items:center}.art{width:64px;height:64px;object-fit:cover;border-radius:9px}.meta{flex:1;min-width:0}.title{font-size:19px;font-weight:600;margin:0}.artist{font-size:11px;color:var(--dim);margin-top:2px}.heart{font-size:22px;color:var(--accent)}input[type=range]{width:100%;height:12px;accent-color:var(--accent);margin:15px 0 0;cursor:pointer}.time{display:flex;justify-content:space-between;font:9px ui-monospace,monospace;color:var(--dim)}.controls{display:flex;align-items:center;justify-content:space-between;margin:10px 5px}.controls button{width:30px;height:32px;font-size:19px;display:flex;align-items:center;justify-content:center}.controls .play{width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--ink);font-size:16px}.lyrics{height:89px;overflow:auto;text-align:center;margin:8px 0 12px;color:var(--dim);font-size:11px;line-height:28px;scrollbar-width:none}.lyrics .current{font-size:13px;font-weight:600;color:var(--fg)}.bottom{border-top:1px solid var(--accent);padding-top:12px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}.pill{border:1px solid var(--accent);border-radius:20px;padding:4px 10px;font-size:10px}.pill.on{background:var(--accent);color:var(--ink)}.search{display:flex;gap:6px;margin-top:10px}.search input{min-width:0;flex:1;border:1px solid var(--accent);border-radius:20px;background:transparent;padding:6px 10px;font-size:11px}.search button{border:1px solid var(--accent);border-radius:20px;padding:5px 11px;font-size:11px}.playing .dot{animation:pulse 1s infinite alternate}@keyframes pulse{to{opacity:.3}}.b .player{padding:20px;margin-left:22px;margin-right:22px}.b .track{align-items:flex-start}.b .art{width:46px;height:46px}.b .title{font-size:17px}.b .lyrics{height:160px;text-align:left;font-size:14px;line-height:35px;margin:14px 0}.b .lyrics .current{font-size:21px;line-height:1.6;letter-spacing:.02em}.b .lyrics .current:before{content:'';display:inline-block;width:3px;height:17px;background:var(--accent);margin-right:9px}.b .controls{margin:7px 20px 14px}.c .player{padding:0}.c .cap{padding:14px 16px;margin:0;border-bottom:1px solid var(--accent)}.c .track{padding:17px 16px 8px}.c .art{border-radius:50%;width:72px;height:72px;outline:5px solid var(--tint);border:7px solid var(--fg)}.c .title{font-size:17px}.c .transport{padding:0 16px}.c .controls{margin:6px 2px}.c .lyrics{height:58px;margin:2px 16px 14px}.queue{border-top:1px solid var(--accent);padding:9px 16px}.queue>div{display:flex;align-items:center;padding:6px 0;gap:10px;font-size:11px}.queue small{color:var(--dim);font-size:10px}.queue span:nth-child(2){flex:1}.queue .num{font:10px monospace;color:var(--dim)}.queue .now{color:var(--fg);font-weight:600}.c .bottom{border-top:1px solid var(--accent);padding:12px 16px}.c .search{margin:0 16px 14px}.c .lyrics .current{font-size:12px}.b .bottom{margin-top:5px}
</style><body><main class="page"><header class="cover"><span class="brand">SMALL BAR</span><button class="theme" title="切换配色">◐</button></header><img class="avatar" src="../../assets/opening/light-avatar.jpg"><div class="name">yesyes</div><p class="sign">a quiet seat, kept for you</p><section class="receipt"><div><label>SEAT</label><i></i><span>by the window</span></div><div><label>DRINK</label><i></i><span>the usual</span></div><div><label>DATE</label><i></i><span>2026.11.10</span></div></section><section class="player"><div class="cap"><span><i class="dot"></i>NOW PLAYING</span><span class="state">正在播放<button class="source">换个来源</button></span></div><div class="track"><img class="art" src="../../assets/opening/dark-avatar.jpg"><div class="meta"><div class="title">夜航 · 预览曲目</div><div class="artist">Small Bar / 布局示意</div></div><button class="heart" title="收藏">♡</button></div><div class="lyrics"><div>窗边留下了一点微光</div><div class="current">让这一刻，慢一点</div><div>听风经过安静的夜晚</div><div>下一句歌词，随着音乐向前</div></div><div class="transport"><input aria-label="播放进度" type="range" value="36"><div class="time"><span>1:28</span><span>4:06</span></div><div class="controls"><button title="循环">↻</button><button title="上一首">‹Ⅰ</button><button class="play" title="播放或暂停">Ⅱ</button><button title="下一首">Ⅰ›</button><button class="list" title="展开歌单">☰</button></div></div><div class="queue" hidden><div class="now"><span class="num">01</span><span>夜航 <small>Small Bar</small></span><button>⋯</button></div><div><span class="num">02</span><span>窗边 <small>Small Bar</small></span><button>⋯</button></div></div><div class="bottom"><button class="pill on">听点小曲 6</button><button class="pill">收藏 3</button><button class="pill">＋ 歌单</button></div><div class="search"><input placeholder="搜索歌曲或歌手"><button>搜索</button></div></section></main><script>
const v=new URLSearchParams(location.search).get('v')||'a';document.body.classList.add(v);const player=document.querySelector('.player'),lyrics=document.querySelector('.lyrics'),transport=document.querySelector('.transport');if(v==='a')transport.after(lyrics);if(v==='c'){transport.after(lyrics);document.querySelector('.queue').hidden=false;}let theme=0;document.querySelector('.theme').onclick=()=>{theme=(theme+1)%3;document.body.classList.toggle('dark',theme===1);document.body.classList.toggle('pink',theme===2)};document.querySelector('.play').onclick=e=>{const paused=e.currentTarget.textContent==='Ⅱ';e.currentTarget.textContent=paused?'▶':'Ⅱ';player.classList.toggle('playing',!paused);document.querySelector('.state').firstChild.textContent=paused?'已暂停':'正在播放'};document.querySelector('.heart').onclick=e=>e.currentTarget.textContent=e.currentTarget.textContent==='♡'?'♥':'♡';document.querySelector('.list').onclick=()=>{const q=document.querySelector('.queue');q.hidden=!q.hidden};document.querySelector('.source').onclick=e=>{const label=e.currentTarget.parentNode.firstChild;label.textContent='切换来源中…';setTimeout(()=>label.textContent='正在播放',800)};
</script></body></html>
